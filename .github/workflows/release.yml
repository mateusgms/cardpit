name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # DESKTOP holds the TELEGRAM_KEY and TELEGRAM_CHAT_ID secrets stamped
    # into the release exe.
    environment: DESKTOP
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build release exe
        env:
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: make release VERSION=${{ github.ref_name }}

      - name: Generate checksums
        env:
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: make checksums VERSION=${{ github.ref_name }}

      - name: Create installer zip
        env:
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: make zip VERSION=${{ github.ref_name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cardpit.exe
            dist/checksums.txt
            dist/cardpit-${{ github.ref_name }}-windows-amd64.zip
