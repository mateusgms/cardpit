name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: core/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build release exe
        run: make release VERSION=${{ github.ref_name }}

      - name: Generate checksums
        run: make checksums VERSION=${{ github.ref_name }}

      - name: Create installer zip
        run: make zip VERSION=${{ github.ref_name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cardpit.exe
            dist/checksums.txt
            dist/cardpit-${{ github.ref_name }}-windows-amd64.zip
